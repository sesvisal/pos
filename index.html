.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px}.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:8px;cursor:pointer;color:var(--mute);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
</style>

function logoFrom(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(im.width,im.height),c=document.createElement('canvas'),x=c.getContext('2d');c.width=c.height=192;x.fillStyle='#fff';x.fillRect(0,0,192,192);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,192,192);cb(c.toDataURL('image/jpeg',.88))};im.onerror=function(){toast('That file could not be read as a picture.')};im.src=r.result};r.readAsDataURL(file)}

function toDone(s){var d=new Date(s.t);return{title:'Receipt',when:d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),total:s.total,items:s.items,pm:payLabel(s),cash:s.recv!=null?{rt:$(s.recv),change:s.change||0}:null}}
function viewReceipt(){
  var days={},keys=[];
  S.sales.slice().sort(function(a,b){return b.t-a.t}).forEach(function(s){var k=dkey(new Date(s.t));if(!days[k]){days[k]=[];keys.push(k)}days[k].push(s)});

    var list=days[k],sum=0;list.forEach(function(s){sum+=s.total});
    var label=k===td?'Today':k===yd?'Yesterday':new Date(k+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  });
  return h}
var CAMX='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/><path d="M4 4l16 16"/></svg>';
function canEdit(l){var m=find(l.id);return !!m&&(fs(m)||fi(m)||fh(m)||fp(m))}
function selLine(){return cart.filter(function(x){return x.key===sel})[0]}
function iceOpts(m){return (fi(m)?ICE:[]).concat(fh(m)?['Hot']:[])}
function iceDef(m){var o=iceOpts(m);if(!o.length)return '';return o.indexOf(lastOpt.ice)>-1?lastOpt.ice:(fi(m)?'Normal Ice':'Hot')}
function defOpts(m){return{sugar:fs(m)?lastOpt.sugar:'',ice:iceDef(m)}}
function setOpt(k,v){var l=selLine();if(!l)return;var o={sugar:l.sugar,ice:l.ice,top:(l.top||[]).slice()};
  if(k==='top'){var i=o.top.indexOf(v);if(i>-1)o.top.splice(i,1);else o.top.push(v)}else{o[k]=v;if(k==='sugar')lastOpt.sugar=v;else lastOpt.ice=v}
  if(l.qty>1)l.qty--;else cart=cart.filter(function(x){return x!==l});
  sel=lineAdd(l.id,o.sugar,o.ice,o.top)}
function optPanel(){var l=selLine();if(!l)return '';var m=find(l.id);if(!m||!(fs(m)||fi(m)||fh(m)||fp(m)))return '';
  function row(label,list,cur,k){return '<div class="orow2"><div class="olab">'+label+'</div><div class="ochips k-'+k+'">'+list.map(function(v){return '<button class="oc" data-act="opt" data-k="'+k+'" data-v="'+e(v)+'" aria-pressed="'+(cur===v)+'">'+e(v)+'</button>'}).join('')+'</div></div>'}
  var h='<div class="optp"><div class="ohead"><b>'+e(m.name)+'</b><span class="mute">'+$(lineUnit(l,m))+'</span></div>';
  if(fs(m))h+=row('Sugar level',SUG,l.sugar,'sugar');
  var io=iceOpts(m);if(io.length)h+=row('Ice level',io,l.ice,'ice');
  if(fp(m)&&S.tops.length)h+='<div class="orow2"><div class="olab">Topping</div><div class="ochips wrapc">'+S.tops.map(function(t){return '<button class="oc" data-act="opt" data-k="top" data-v="'+e(t.name)+'" aria-pressed="'+((l.top||[]).indexOf(t.name)>-1)+'">'+e(t.name)+' <small>+'+$(t.price)+'</small></button>'}).join('')+'</div></div>';
  return h+'</div>'}
function topPanel(){var rows=S.tops.map(function(t){return '<div class="row"><span>'+e(t.name)+'</span><span class="inl"><label class="pwrap"><i>'+e(S.cur)+'</i><input class="pin" type="text" inputmode="decimal" value="'+t.price+'" data-act="tprice" data-name="'+e(t.name)+'" aria-label="Price of '+e(t.name)+'"></label><button class="ib trash" data-act="tdel" data-name="'+e(t.name)+'" aria-label="Delete '+e(t.name)+'" title="Delete topping">'+TRASH+'</button></span></div>'}).join('')||'<p class="empty">No toppings yet.</p>';
  return '<div class="panel gap"><h2>Toppings</h2><div class="hint" style="margin:0 0 8px">Turn the Topping button on for a drink to offer these toppings.</div>'+rows+'<div class="form" style="margin:12px 0 0"><input class="n" id="tn" placeholder="New topping, e.g. Boba"><label class="pwrap"><i>'+e(S.cur)+'</i><input class="pin" id="tp" type="text" inputmode="decimal" placeholder="Price"></label><button class="btn sm" data-act="taddt">Add topping</button></div></div>'}
function cartBar(){var n=0;cart.forEach(function(l){n+=l.qty});return n?'<button class="cbar" data-act="gocart"><span>'+n+(n>1?' items':' item')+' · '+$(cartTotal())+'</span><b>View order</b></button>':''}
function reportData(d){var sales=S.sales.filter(function(s){return dkey(new Date(s.t))===d}),total=0,qty=0,byItem={},byCat={},byPay={};sales.forEach(function(s){total+=s.total;var pl=payLabel(s);byPay[pl]=(byPay[pl]||0)+s.total;s.items.forEach(function(i){qty+=i.qty;byItem[i.name]=byItem[i.name]||{q:0,r:0};byItem[i.name].q+=i.qty;byItem[i.name].r+=i.qty*i.price;byCat[i.cat]=(byCat[i.cat]||0)+i.qty*i.price})});return{sales:sales,total:total,qty:qty,byItem:byItem,byCat:byCat,byPay:byPay}}
async function makePdf(){
  var J=window.jspdf&&window.jspdf.jsPDF;
  if(!J){toast('The PDF tool did not load. Check your connection and try again.');return}
  var R=reportData(day);
  if(!R.sales.length){toast('No orders on this day to save.');return}
  var dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(x){}
  if(!dl){toast('Saving files is not available in this view.');return}
  var doc=new J({unit:'mm',format:'a4'}),W=210,M=16,y=20,P=function(s){return String(s).replace(/[^\x20-\xff]/g,'?')};
  function need(h){if(y+h>284){doc.addPage();y=20}}
  function txt(t,x,o,font,size,col){doc.setFont('helvetica',font);doc.setFontSize(size);doc.setTextColor(col[0],col[1],col[2]);doc.text(P(t),x,y,o)}
  function head(t){need(16);y+=5;txt(t,M,{},'bold',12,[122,74,43]);y+=2;doc.setDrawColor(225);doc.line(M,y,W-M,y);y+=6}
  function kv(l,r,b){need(7);txt(l,M,{},b?'bold':'normal',10.5,[30,30,30]);txt(r,W-M,{align:'right'},b?'bold':'normal',10.5,[30,30,30]);y+=6.5}
  var rate=S.rate||4100;
  txt('Sal & Nea Coffee',M,{},'bold',18,[30,30,30]);y+=7;
  txt('Daily report',M,{},'normal',11,[110,110,110]);y+=6;
  txt(new Date(day+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),M,{},'bold',11,[30,30,30]);y+=4;
  head('Summary');
  kv('Total sales (USD)',$(R.total),true);
  kv('Total sales (Riel)',rielFmt(R.total)+' KHR',true);
  kv('Exchange rate (receive)','1 USD = '+rate.toLocaleString('en-US')+' KHR');kv('Exchange rate (refund)','1 USD = '+(S.refund||4000).toLocaleString('en-US')+' KHR');
  kv('Orders',String(R.sales.length));
  kv('Drinks sold',String(R.qty));
  kv('Average order',$(R.total/R.sales.length));
  head('Payments');
  Object.keys(R.byPay).forEach(function(k){kv(k,$(R.byPay[k]))});
  head('Sales by category');
  Object.keys(R.byCat).sort(function(a,b){return R.byCat[b]-R.byCat[a]}).forEach(function(k){kv(k,$(R.byCat[k]))});
  head('Drinks');
  Object.keys(R.byItem).sort(function(a,b){return R.byItem[b].q-R.byItem[a].q}).forEach(function(k){kv(k+'  x '+R.byItem[k].q,$(R.byItem[k].r))});
  head('Orders');
  R.sales.forEach(function(s){
    need(14);txt(new Date(s.t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+'   '+payLabel(s),M,{},'bold',10.5,[30,30,30]);txt($(s.total),W-M,{align:'right'},'bold',10.5,[30,30,30]);y+=5.5;
    var t=s.items.map(function(i){return i.qty+' x '+i.name+(optText(i)?' ('+optText(i)+')':'')}).join('; ');
    if(s.recv!=null)t+='; cash received '+$(s.recv)+', change '+$(s.change||0);
    doc.setFont('helvetica','normal');doc.setFontSize(9.5);
    doc.splitTextToSize(P(t),W-2*M-24).forEach(function(ln){need(5);txt(ln,M,{},'normal',9.5,[110,110,110]);y+=4.8});
    y+=2.5;
  });
  need(12);y+=6;txt('Generated '+new Date().toLocaleString('en-GB'),M,{},'normal',8.5,[140,140,140]);
  try{await dl.save({filename:'Daily-Report-'+day+'.pdf',data:doc.output('arraybuffer')});toast('PDF saved')}catch(x){if(!x||x.code!=='declined')toast('Could not save the PDF')}
}
function payLabel(s){return s.pay==='khqr'?(s.bank||'KHQR'):(PAYN[s.pay]||'Not recorded')}
function payHtml(){
  function pb(v,t,w){return '<button class="opt pay'+(w?' wide':'')+'" data-act="pay" data-v="'+v+'" aria-pressed="'+(pay===v)+'">'+t+'</button>'}
  var h='<div class="lab">Payment</div><div class="paygrid">'+pb('cash','Cash')+pb('khqr','KHQR')+pb('card','Credit/Debit Card',1)+'</div>';
  h+='<div class="pdyn">';if(pay==='khqr')h+='<div class="lab">Select bank</div><div class="paygrid">'+BANKS.map(function(n){return '<button class="opt pay" data-act="bank" data-v="'+e(n)+'" aria-pressed="'+(bank===n)+'">'+e(n)+'</button>'}).join('')+'</div>';
  if(pay==='cash')h+='<div class="lab lr"><span>Cash received</span><span class="chg" id="chg">'+chgText()+'</span></div><div class="recv"><input id="recv" type="text" inputmode="decimal" autocomplete="off" value="'+e(recv)+'" aria-label="Cash received"><button class="opt rc" data-act="rcur" data-v="usd" aria-pressed="'+(recvCur==='usd')+'">USD</button><button class="opt rc" data-act="rcur" data-v="khr" aria-pressed="'+(recvCur==='khr')+'">KHR</button></div>';
  return h+'</div><div style="height:6px"></div>'}
var SUG=['0%','30%','50%','70%','100%','120%'],ICE=['More Ice','Normal Ice','Less Ice','No Ice'],lastOpt={sugar:'100%',ice:'Normal Ice'};
function openPick(id){var m=find(id);pick={id:id,sugar:fs(m)?lastOpt.sugar:'',ice:fi(m)?lastOpt.ice:'',temp:fh(m)?(fi(m)?'Cold':'Hot'):''};renderPick()}
function renderPick(){var md=document.getElementById('modal');
  if(cdel){var ds=S.sales.filter(function(s){return s.id==cdel})[0];md.innerHTML='<div class="sheet" role="alertdialog" aria-modal="true" aria-label="Delete receipt"><div class="warn">'+TRASH+'</div><h2 class="dt bad">Delete this receipt?</h2><p class="cmsg">Are you sure you want to delete this order'+(ds?' ('+$(ds.total)+')':'')+'? It will also be removed from the Daily report. This cannot be undone.</p><div class="acts"><button class="btn ghost" data-pk="delno">Cancel</button><button class="btn dng" data-pk="delyes">Delete</button></div></div>';md.hidden=false;return}
  if(done){md.innerHTML=doneHtml();md.hidden=false;return}
  if(!pick){md.hidden=true;md.innerHTML='';return}var m=find(pick.id);
  function opts(list,k){return list.map(function(v){return '<button class="opt" data-pk="'+k+'" data-v="'+v+'" aria-pressed="'+(pick[k]===v)+'">'+v+'</button>'}).join('')}
  md.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="Choose options"><h2>'+e(m.name)+' <span class="mute">'+$(m.price)+'</span></h2>'+(fs(m)?'<div class="lab">Sugar level</div><div class="opts">'+opts(SUG,'sugar')+'</div>':'')+(fh(m)?'<div class="lab">Serve</div><div class="opts">'+opts(['Hot','Cold'],'temp')+'</div>':'')+(fi(m)&&pick.temp!=='Hot'?'<div class="lab">Ice level</div><div class="opts">'+opts(ICE,'ice')+'</div>':'')+'<div class="acts"><button class="btn ghost" data-pk="cancel">Cancel</button><button class="btn" data-pk="ok">'+(pick.edit?'Save changes':'Add to order')+'</button></div></div>';md.hidden=false}
document.getElementById('modal').addEventListener('click',function(ev){
  var b=ev.target.closest('[data-pk]');
  if(!b){if(ev.target.id==='modal'){pick=null;done=null;cdel=null;renderPick()}return}
  var k=b.dataset.pk;if(k==='delno'){cdel=null;renderPick();return}if(k==='delyes'){var did=cdel;S.sales=S.sales.filter(function(s){return s.id!=did});cdel=null;save();toast('Receipt deleted');render();renderPick();return}if(k==='done'){done=null;renderPick();return}
  if(k==='cancel'){pick=null}
  else if(k==='ok'){var pm2=find(pick.id);pick.sugar=fs(pm2)?pick.sugar:'';pick.ice=pick.temp==='Hot'?'Hot':(fi(pm2)?pick.ice:(pick.temp==='Cold'?'Cold':''));if(pick.edit){var ol=cart.filter(function(x){return x.key===pick.edit})[0];if(ol){var nk=pick.id+'|'+pick.sugar+'|'+pick.ice,ex=cart.filter(function(x){return x.key===nk&&x!==ol})[0];if(ex){ex.qty+=ol.qty;cart=cart.filter(function(x){return x!==ol})}else{ol.sugar=pick.sugar;ol.ice=pick.ice;ol.key=nk}}}else{lineAdd(pick.id,pick.sugar,pick.ice);lastOpt={sugar:pick.sugar||lastOpt.sugar,ice:ICE.indexOf(pick.ice)>-1?pick.ice:lastOpt.ice}}pick=null;render()}
  else{pick[k]=b.dataset.v}
  renderPick()});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&(pick||done||cdel)){pick=null;done=null;cdel=null;renderPick()}});
var TKEY='coffee-pos-theme',th='light';
try{th=localStorage.getItem(TKEY)||'light'}catch(e){}
function applyTheme(){var r=document.documentElement;if(th==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',th);document.querySelectorAll('#seg button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.th===th)})}
document.getElementById('seg').addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;th=b.dataset.th;try{localStorage.setItem(TKEY,th)}catch(e){}applyTheme()});
applyTheme();
setLogos();
render();
